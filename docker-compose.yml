version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fogtrust-backend
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - DJANGO_CSRF_TRUSTED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - SQLITE_PATH=/data/db.sqlite3
    volumes:
      - broker-data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/')\""]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - fogtrust-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fogtrust-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - fogtrust-net

volumes:
  broker-data:

networks:
  fogtrust-net:
    driver: bridge

